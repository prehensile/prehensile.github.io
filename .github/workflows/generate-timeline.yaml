name: generate-timeline
on:
  push:
    paths:
      - '_timeline/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
      - run: |
          git config --local user.name actions-user
          git config --local user.email "actions@github.com"
      - run: |
          cd _timeline
          sh build-ci.sh
